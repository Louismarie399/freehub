<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Faisons connaissance</title>
<style>
  :root{
    --bg:#0d1526; --carte:#18233a; --carte2:#1f2c47; --bord:rgba(255,255,255,.1);
    --encre:#eef2f9; --doux:#9aa9c2; --acc:#5b8cff; --acc2:#38bdf8; --ok:#2dd4a7;
    --police:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--encre);
    font-family:var(--police);display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(900px 500px at 15% -5%,rgba(91,140,255,.22),transparent 60%),
      radial-gradient(700px 420px at 95% 100%,rgba(56,189,248,.14),transparent 60%)}
  .zone{position:relative;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;gap:18px}
  .carte{width:100%;max-width:560px;background:var(--carte);border:1px solid var(--bord);
    border-radius:22px;padding:30px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
  h1{margin:0;font-size:27px;line-height:1.2;letter-spacing:-.025em;text-wrap:balance}
  .sous{margin:9px 0 0;color:var(--doux);font-size:15px;line-height:1.55}
  label{display:block;font-size:12.5px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--doux);margin:22px 0 8px}
  input,textarea{width:100%;background:var(--carte2);border:1.5px solid var(--bord);
    border-radius:14px;padding:15px 16px;font-family:inherit;font-size:16px;
    color:var(--encre);outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{min-height:130px;resize:vertical;line-height:1.55}
  button{width:100%;margin-top:16px;border:none;border-radius:14px;padding:16px;
    background:var(--acc);color:#fff;font-family:inherit;font-size:16px;font-weight:800;
    cursor:pointer;transition:filter .15s,transform .15s}
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .err{margin-top:12px;color:#ff9fb0;font-size:14px;min-height:20px}

  /* ---- L'accueil : on confirme franchement, on ne laisse pas dans le doute ---- */
  .bienvenue{position:fixed;inset:0;z-index:20;display:flex;align-items:center;
    justify-content:center;background:rgba(13,21,38,.92);backdrop-filter:blur(4px);
    animation:paraitre .25s ease}
  .bv-x{text-align:center;animation:surgir .5s cubic-bezier(.2,1.4,.4,1) both}
  .bv-e{font-size:76px;line-height:1}
  .bv-t{margin-top:14px;font-size:25px;font-weight:800;letter-spacing:-.022em}
  .bv-d{margin-top:7px;color:var(--doux);font-size:15px}
  @keyframes paraitre{from{opacity:0}}
  @keyframes surgir{from{opacity:0;transform:scale(.7)}}

  /* ---- Le choix de l'emoji ---- */
  .grille-em{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;
    max-height:168px;overflow-y:auto;padding:4px;background:var(--carte2);
    border:1.5px solid var(--bord);border-radius:14px}
  .em-b{width:100%;aspect-ratio:1;margin:0;padding:0;border:1.5px solid transparent;
    border-radius:11px;background:transparent;font-size:23px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s}
  .em-b:hover{background:rgba(255,255,255,.07)}
  .em-b.on{background:rgba(91,140,255,.26);border-color:var(--acc)}

  /* ---- Le salon : une page structurée, sans animation ----
     Rien ne bouge ici : le salon se met à jour toutes les deux secondes, et la
     moindre animation se rejouait à chaque fois — on aurait dit que la page se
     rechargeait sans arrêt. */
  .moi-carte{text-align:center;padding:34px 30px 30px}
  .moi-em{font-size:62px;line-height:1}
  .moi-nom{margin-top:10px;font-size:28px;font-weight:800;letter-spacing:-.025em}
  .moi-ok{margin-top:7px;display:inline-flex;align-items:center;gap:7px;
    background:rgba(45,212,167,.14);border:1px solid rgba(45,212,167,.4);color:#9df0d8;
    border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700}
  .modif{margin-top:14px;width:auto;padding:9px 16px;background:transparent;
    border:1.5px solid var(--bord);color:var(--doux);font-size:13px;border-radius:11px}
  .modif:hover{border-color:var(--acc);color:var(--encre);filter:none}

  .attente{margin-top:22px;padding:18px;border-radius:16px;background:var(--carte2);
    border:1px solid var(--bord);text-align:center}
  .attente-t{font-size:15.5px;font-weight:800;display:flex;align-items:center;
    justify-content:center;gap:9px}
  .attente-d{margin-top:6px;font-size:13.5px;color:var(--doux);line-height:1.5}

  .liste-t{margin:24px 0 11px;font-size:12px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--doux);text-align:left}
  .liste{display:flex;flex-wrap:wrap;gap:8px}
  .pst{display:flex;align-items:center;gap:8px;background:var(--carte2);
    border:1px solid var(--bord);border-radius:999px;padding:7px 14px 7px 10px;
    font-size:14px;font-weight:700}
  .pst .em{font-size:18px;line-height:1}
  .pst.moi{background:linear-gradient(135deg,rgba(91,140,255,.34),var(--carte2));
    border-color:var(--acc)}

  .num{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--acc2)}
  .envoye{margin-top:16px;background:rgba(45,212,167,.12);border:1px solid rgba(45,212,167,.4);
    border-radius:14px;padding:14px 16px;font-size:14.5px;color:#9df0d8;line-height:1.5}
  .pied{text-align:center;padding:18px;font-size:12.5px;color:#55637d;position:relative}
</style>
</head>
<body>
<div class="zone" id="zone"></div>
<div class="pied">FreeHub · espace de cours</div>

<script>
(function(){
  'use strict';
  var API = 'api.php?a=';
  var zone = document.getElementById('zone');
  var moi = null;                 // { id, nom, jeton }
  var etat = null;
  var brouillon = '';
  var dernierRendu = '';
  var sondeOk = false;            // a-t-on déjà reçu une réponse du serveur ?

  try { moi = JSON.parse(localStorage.getItem('cours_moi') || 'null'); } catch(e){}

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function appel(action, corps){
    return fetch(API + action, {
      method: corps ? 'POST' : 'GET',
      headers: { 'Content-Type':'application/json' },
      body: corps ? JSON.stringify(corps) : undefined,
      credentials: 'same-origin'
    }).then(function(r){
      return r.text().then(function(txt){
        try { return { ok:r.ok, d:JSON.parse(txt) }; }
        catch(e){
          return { ok:false, d:{ erreur:'Le serveur a renvoyé une réponse inattendue '
            + '(HTTP ' + r.status + '). Réessaie.' } };
        }
      });
    }, function(){
      return { ok:false, d:{ erreur:'Pas de réseau — vérifie ta connexion.' } };
    });
  }

  // La même liste que côté serveur, qui n'accepte que celle-ci.
  var EMOJIS = ['🦊','🐼','🐸','🦁','🐙','🦄','🐨','🦉','🐢','🦋','🐝','🦕','🐧','🦩',
                '🐬','🦒','🦔','🐳','🦓','🦜','🐲','🦅','🐺','🦌','🐥','🦚','🐯','🐵',
                '🦘','🦦','🐰','🦈','🦭','🐞','🌵','🍄','⚡️','🔥','🌙','⭐️','🎸','🚀'];
  var monEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

  // Repli pour un participant inscrit avant qu'on ne propose le choix : son
  // prénom détermine un emoji stable plutôt que de laisser la place vide.
  function emojiDe(nom, choisi){
    if(choisi) return choisi;
    var n = (nom || '').toLowerCase(), h = 0;
    for(var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 100000;
    return EMOJIS[h % EMOJIS.length];
  }

  function grilleEmojis(){
    return '<div class="grille-em" id="gem">' + EMOJIS.map(function(e){
      return '<button type="button" class="em-b' + (e === monEmoji ? ' on' : '')
        + '" data-em="' + e + '">' + e + '</button>';
    }).join('') + '</div>';
  }
  function brancherEmojis(){
    [].forEach.call(document.querySelectorAll('[data-em]'), function(b){
      b.onclick = function(){
        monEmoji = b.getAttribute('data-em');
        [].forEach.call(document.querySelectorAll('[data-em]'), function(x){
          x.classList.toggle('on', x === b);
        });
      };
    });
  }

  // --- Écran 1 : le prénom et l'emoji ---------------------------------------
  // `modif` : on revient corriger ce qu'on a saisi, l'inscription existe déjà.
  function vueNom(msg, modif){
    salonPose = '';
    var nomActuel = modif && moi ? moi.nom : '';
    zone.innerHTML = '<div class="carte">'
      + '<h1>' + esc(modif ? 'Modifier mes infos'
                           : (etat && etat.titre ? etat.titre : 'Faisons connaissance')) + '</h1>'
      + '<p class="sous">' + (modif
          ? 'Change ton prénom ou ton emoji. C’est possible tant que les questions '
            + 'ne sont pas lancées.'
          : 'Indique ton prénom et choisis ton emoji pour rejoindre. On attendra que '
            + 'tout le monde soit là avant de commencer.') + '</p>'
      + '<label for="n">Ton prénom</label>'
      + '<input id="n" autocomplete="given-name" autocapitalize="words" '
      + 'placeholder="Maëlys" maxlength="60" value="' + esc(nomActuel) + '">'
      + '<label>Ton emoji</label>'
      + grilleEmojis()
      + '<button id="go">' + (modif ? 'Enregistrer' : 'Rejoindre') + '</button>'
      + (modif ? '<button id="annul" class="modif" style="width:100%;margin-top:9px">'
               + 'Annuler</button>' : '')
      + '<div class="err" id="e">' + esc(msg || '') + '</div>'
      + '</div>';
    brancherEmojis();
    var inp = document.getElementById('n');
    var btn = document.getElementById('go');
    inp.focus();

    var annul = document.getElementById('annul');
    if(annul) annul.onclick = function(){ dernierRendu = ''; rendre(); };

    function envoyer(){
      var nom = inp.value.trim();
      if(nom.length < 2){ document.getElementById('e').textContent = 'Il faut au moins 2 caractères.'; return; }
      btn.disabled = true; btn.textContent = 'Un instant…';

      if(modif){
        appel('modifier', { jeton:moi.jeton, nom:nom, emoji:monEmoji }).then(function(r){
          btn.disabled = false; btn.textContent = 'Enregistrer';
          if(!r.ok){ document.getElementById('e').textContent = r.d.erreur || 'Échec.'; return; }
          moi.nom = nom; moi.emoji = monEmoji;
          try { localStorage.setItem('cours_moi', JSON.stringify(moi)); } catch(e){}
          dernierRendu = '';
          battre();
          rendre();
        });
        return;
      }

      appel('rejoindre', { nom:nom, emoji:monEmoji }).then(function(r){
        btn.disabled = false; btn.textContent = 'Rejoindre';
        if(!r.ok){ document.getElementById('e').textContent = r.d.erreur || 'Impossible de rejoindre.'; return; }
        moi = r.d;
        if(moi.emoji) monEmoji = moi.emoji;
        try { localStorage.setItem('cours_moi', JSON.stringify(moi)); } catch(e){}
        bienvenue(moi.nom);
        // On bascule TOUT DE SUITE, sur ce qu'on a déjà en main. Avant, on
        // attendait le relevé suivant pour changer d'écran : s'il tardait,
        // s'il échouait, ou si le tout premier n'était pas encore revenu, on
        // restait sur le formulaire et le bouton semblait n'avoir rien fait.
        if(!etat) etat = { titre:'Faisons connaissance', etat:'attente', idx:0,
                           total:0, eleves:[], question:null, maReponse:null };
        etat.moi = { id:moi.id, nom:moi.nom, emoji:monEmoji };
        if(!etat.eleves.some(function(x){ return x.nom === moi.nom; })){
          etat.eleves.push({ nom:moi.nom, emoji:monEmoji });
        }
        sondeOk = false;
        dernierRendu = '';
        rendre();
        battre();
      });
    }
    btn.onclick = envoyer;
    inp.onkeydown = function(e){ if(e.key === 'Enter') envoyer(); };
  }

  // Le moment de confirmation : on voit son emoji, on sait que c'est passé.
  function bienvenue(nom){
    var d = document.createElement('div');
    d.className = 'bienvenue';
    d.innerHTML = '<div class="bv-x">'
      + '<div class="bv-e">' + emojiDe(nom, monEmoji) + '</div>'
      + '<div class="bv-t">Bienvenue ' + esc(nom) + '</div>'
      + '<div class="bv-d">Voilà ton emoji pour la partie</div>'
    + '</div>';
    document.body.appendChild(d);
    setTimeout(function(){
      d.style.transition = 'opacity .3s';
      d.style.opacity = '0';
      setTimeout(function(){ d.remove(); }, 320);
    }, 1500);
  }

  // --- Écran 2 : le salon ---------------------------------------------------
  // Bâti UNE FOIS, puis seuls le compteur et la liste sont retouchés. Tout
  // redessiner à chaque relevé donnait un clignotement de deux secondes :
  // c'était ça, « l'effet rafraîchissement bizarre ».
  var salonPose = '';
  function vueSalon(){
    var noms = etat.eleves || [];
    var monNom = moi ? moi.nom : '';
    var monEm = emojiDe(monNom, (etat.moi && etat.moi.emoji) || moi.emoji || monEmoji);

    var signature = monNom + '|' + monEm;
    if(salonPose !== signature){
      salonPose = signature;
      zone.innerHTML = '<div class="carte moi-carte">'
        + '<div class="moi-em">' + monEm + '</div>'
        + '<div class="moi-nom">' + esc(monNom) + '</div>'
        + '<div class="moi-ok">✓ Tu es dans la salle</div>'
        + '<button class="modif" id="chg">Modifier mon prénom ou mon emoji</button>'
        + '<div class="attente">'
          + '<div class="attente-t">⏳ En attente du lancement</div>'
          + '<div class="attente-d">' + esc(etat.titre) + ' commencera quand '
          + 'l’animateur lancera la première question. Tu n’as rien à faire, '
          + 'garde juste cette page ouverte.</div>'
        + '</div>'
        + '<div class="liste-t" id="l-t"></div>'
        + '<div class="liste" id="l-l"></div>'
      + '</div>';
      document.getElementById('chg').onclick = function(){
        monEmoji = monEm;
        vueNom('', true);
      };
    }

    var t = document.getElementById('l-t');
    var l = document.getElementById('l-l');
    if(t) t.textContent = 'Dans la salle · ' + noms.length;
    if(l){
      var html = noms.map(function(p){
        var estMoi = monNom && p.nom.toLowerCase() === monNom.toLowerCase();
        return '<span class="pst' + (estMoi ? ' moi' : '') + '">'
          + '<span class="em">' + emojiDe(p.nom, p.emoji) + '</span>' + esc(p.nom) + '</span>';
      }).join('');
      // On n'écrit que si ça change : réécrire la liste identique à chaque
      // relevé suffisait à faire sauter l'affichage.
      if(l.getAttribute('data-sig') !== html){
        l.setAttribute('data-sig', html);
        l.innerHTML = html;
      }
    }
  }

  // --- Écran 3 : une question ----------------------------------------------
  function vueQuestion(){
    salonPose = '';          // on quitte le salon : il sera rebâti au retour
    var q = etat.question;
    var deja = etat.maReponse;
    zone.innerHTML = '<div class="carte">'
      + '<div class="num">Question ' + (etat.idx + 1) + ' sur ' + etat.total + '</div>'
      + '<h1 style="margin-top:10px">' + esc(q.texte) + '</h1>'
      + '<label for="r">Ta réponse</label>'
      + '<textarea id="r" maxlength="2000" placeholder="Écris ce que tu veux, '
      + 'prends ton temps"></textarea>'
      + '<button id="env">' + (deja ? 'Modifier ma réponse' : 'Envoyer') + '</button>'
      + (deja ? '<div class="envoye">Réponse envoyée. Tu peux encore la modifier tant '
              + 'qu’on n’est pas passé à la question suivante.</div>' : '')
      + '<div class="err" id="e"></div>'
      + '</div>';
    var ta = document.getElementById('r');
    ta.value = brouillon || deja || '';
    ta.oninput = function(){ brouillon = ta.value; };
    if(!deja) ta.focus();
    document.getElementById('env').onclick = function(){
      var t = ta.value.trim();
      if(!t){ document.getElementById('e').textContent = 'Ta réponse est vide.'; return; }
      var b = document.getElementById('env');
      b.disabled = true; b.textContent = 'Envoi…';
      appel('repondre', { jeton:moi.jeton, texte:t }).then(function(r){
        b.disabled = false; b.textContent = 'Envoyer';
        if(!r.ok){ document.getElementById('e').textContent = r.d.erreur || 'Échec.'; return; }
        brouillon = '';
        if(etat) etat.maReponse = t;     // confirmation immédiate, sans attendre le relevé
        dernierRendu = '';
        rendre();
        battre();
      });
    };
  }

  function vueFini(){
    salonPose = '';
    zone.innerHTML = '<div class="carte" style="text-align:center">'
      + '<div style="font-size:50px;line-height:1">'
      + emojiDe(moi ? moi.nom : '', moi && moi.emoji) + '</div>'
      + '<h1 style="margin-top:14px">C’est terminé, merci ' + esc(moi ? moi.nom : '') + '</h1>'
      + '<p class="sous">Tes réponses sont bien enregistrées. À tout de suite pour la suite du cours.</p>'
      + '</div>';
  }

  // --- Le rendu -------------------------------------------------------------
  function rendre(){
    // Le salon se met à jour en continu (les arrivées s'affichent), les autres
    // écrans ne se redessinent qu'au vrai changement : sinon on effacerait la
    // réponse en cours de saisie toutes les deux secondes.
    var enSalon = moi && etat.moi && etat.etat !== 'fini'
               && (etat.etat === 'attente' || !etat.question);

    var cle = etat.etat + '|' + etat.idx + '|' + (etat.moi ? '1' : '0')
            + '|' + (etat.maReponse ? 'r' : '-');
    if(!enSalon && cle === dernierRendu) return;
    dernierRendu = cle;

    // On ne renvoie au formulaire QUE si le serveur dit explicitement ne pas
    // connaître ce jeton — pas sur un simple relevé manqué, qui laissait
    // l'impression que l'inscription n'avait servi à rien.
    if(!moi || (sondeOk && !etat.moi)){
      var perdu = !!moi;
      if(moi){ moi = null; try { localStorage.removeItem('cours_moi'); } catch(e){} }
      vueNom(perdu ? 'Ton inscription n’est plus valide — remets ton prénom.' : '');
      return;
    }
    if(etat.etat === 'fini'){ vueFini(); return; }
    if(enSalon){ vueSalon(); return; }
    vueQuestion();
  }

  function battre(){
    // On retient AVEC QUELLE IDENTITÉ la requête part. Le relevé tourne toutes
    // les deux secondes : celui qui était déjà en vol au moment où l'on
    // s'inscrit revient forcément sans jeton, donc avec « je ne connais
    // personne ». Sans ce garde-fou, cette réponse périmée effaçait l'identité
    // qu'on venait d'obtenir et renvoyait au formulaire — on avait validé son
    // prénom, vu la confirmation, et on se retrouvait au départ.
    var jetonReq = moi ? moi.jeton : '';
    var url = 'etat' + (jetonReq ? '&jeton=' + encodeURIComponent(jetonReq) : '');
    appel(url).then(function(r){
      if(!r.ok) return;        // relevé manqué : on garde l'écran en place
      if(jetonReq !== (moi ? moi.jeton : '')) return;   // réponse périmée
      sondeOk = true;
      etat = r.d;
      rendre();
    });
  }

  battre();
  setInterval(battre, 2000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') battre();
  });
})();
</script>
</body>
</html>
