<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Animateur · Faisons connaissance</title>
<style>
  :root{
    --bg:#0d1526; --carte:#18233a; --carte2:#1f2c47; --bord:rgba(255,255,255,.1);
    --encre:#eef2f9; --doux:#9aa9c2; --acc:#5b8cff; --ok:#2dd4a7; --warn:#fbbf24;
    --police:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--encre);font-family:var(--police);
    -webkit-font-smoothing:antialiased}
  .enveloppe{max-width:1180px;margin:0 auto;padding:26px 22px 70px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{margin:0;font-size:23px;letter-spacing:-.022em}
  .lien{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--carte);
    border:1px solid var(--bord);border-radius:12px;padding:9px 13px;font-size:13px;
    color:var(--doux)}
  .lien code{color:var(--encre);font-size:13px}
  .lien button{padding:6px 11px;font-size:12px;margin:0;width:auto}

  .grille{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:980px){ .grille{grid-template-columns:minmax(0,1fr)} }
  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:20px}
  .carte h2{margin:0 0 14px;font-size:12.5px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--doux)}

  input,textarea{width:100%;background:var(--carte2);border:1.5px solid var(--bord);
    border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14.5px;
    color:var(--encre);outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{resize:vertical;line-height:1.5}
  button{border:none;border-radius:11px;padding:11px 16px;background:var(--acc);color:#fff;
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:filter .15s}
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.fant{background:transparent;border:1.5px solid var(--bord);color:var(--doux)}
  button.fant:hover:not(:disabled){border-color:var(--acc);color:var(--encre)}
  button.danger{background:transparent;border:1.5px solid rgba(255,120,140,.4);color:#ff9fb0}

  .qs{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .qr{display:flex;gap:8px;align-items:flex-start;border-radius:12px;
    transition:opacity .12s,box-shadow .12s}
  /* La poignée : c'est elle qui arme le glisser, pas la ligne entière — sinon
     impossible de sélectionner du texte dans le champ. */
  .qr .poi{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    margin-top:6px;cursor:grab;user-select:none}
  .qr .poi:active{cursor:grabbing}
  .qr .n{width:26px;height:26px;border-radius:8px;background:var(--carte2);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;
    color:var(--doux)}
  .qr .grip{font-size:11px;color:#55637d;line-height:1}
  .qr .poi:hover .grip{color:var(--acc)}
  .qr .x{flex:none;background:none;border:none;color:#7b8aa3;font-size:19px;cursor:pointer;
    padding:6px 8px;margin-top:4px}
  .qr .x:hover{color:#ff9fb0}
  .qr.porte{opacity:.4}
  .qr.cible{box-shadow:0 -3px 0 -1px var(--acc)}
  .qr.cible-bas{box-shadow:0 3px 0 -1px var(--acc)}

  /* La boîte de dialogue « repartir à zéro » */
  .voile{position:fixed;inset:0;background:rgba(5,9,18,.72);display:flex;align-items:center;
    justify-content:center;padding:22px;z-index:50}
  .dlg{width:420px;max-width:100%;background:var(--carte);border:1px solid var(--bord);
    border-radius:18px;padding:24px}
  .dlg h3{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
  .dlg p{margin:0;color:var(--doux);font-size:14px;line-height:1.55}
  .choix{display:flex;align-items:flex-start;gap:11px;margin-top:18px;padding:13px 14px;
    background:var(--carte2);border:1.5px solid var(--bord);border-radius:12px;cursor:pointer}
  .choix:hover{border-color:var(--acc)}
  .choix .case{flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--bord);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
    margin-top:1px}
  .choix.on .case{background:var(--acc);border-color:var(--acc);color:#fff}
  .choix b{display:block;font-size:14px}
  .choix span{display:block;font-size:12.5px;color:var(--doux);margin-top:2px;line-height:1.5}
  .dlg-b{display:flex;gap:9px;margin-top:18px}
  .dlg-b button{flex:1}
  .barre{display:flex;gap:8px;flex-wrap:wrap}
  .msg{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:10px;min-height:1px}
  .msg.ok{color:#7ee7c8}
  .msg.ko{color:#ff9fb0}
  .barre button{flex:1;min-width:110px}

  .etat{display:flex;align-items:center;gap:10px;background:var(--carte2);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:700}
  .pt{width:9px;height:9px;border-radius:50%;flex:none}
  .pt.attente{background:var(--warn)} .pt.en_cours{background:var(--ok)}
  .pt.fini{background:#7b8aa3}

  .eleves{display:flex;flex-wrap:wrap;gap:7px}
  .el{display:flex;align-items:center;gap:7px;background:var(--carte2);border:1px solid var(--bord);
    border-radius:999px;padding:6px 8px 6px 13px;font-size:13.5px;font-weight:700}
  .el button{background:none;border:none;color:#7b8aa3;font-size:15px;padding:0 4px;
    cursor:pointer;width:auto;margin:0}
  .el button:hover{color:#ff9fb0}
  .vide{color:var(--doux);font-size:14px;line-height:1.55}

  .q{border:1px solid var(--bord);border-radius:14px;margin-bottom:12px;overflow:hidden;
    background:var(--carte2)}
  .q.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .q-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .q-n{flex:none;font-size:12px;font-weight:800;color:var(--doux);letter-spacing:.06em}
  .q-t{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.35}
  .q-c{flex:none;font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 11px;
    background:rgba(255,255,255,.07);color:var(--doux)}
  .q-c.plein{background:rgba(45,212,167,.16);color:#7ee7c8}
  .q-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:9px}
  .rep{background:var(--carte);border-radius:11px;padding:11px 13px}
  .rep-n{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.02em}
  .rep-t{font-size:14.5px;line-height:1.55;margin-top:4px;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .manque{font-size:12.5px;color:var(--doux);padding-top:2px}

  .porte{max-width:390px;margin:14vh auto;padding:0 20px}
  .err{color:#ff9fb0;font-size:13.5px;min-height:19px;margin-top:9px}
  .aide{font-size:12.5px;color:var(--doux);line-height:1.55;margin-top:10px}
</style>
</head>
<body>
<div id="racine"></div>

<script>
(function(){
  'use strict';
  var API = 'api.php?a=';
  var racine = document.getElementById('racine');
  var D = null;                   // les données du serveur
  var ouvertes = {};              // questions dépliées à droite
  var modeEditeur = null;         // 'attente' | 'verrouille' — pour ne rebâtir qu'au changement

  // Le brouillon des questions : [{ id, t }]. Chaque ligne porte un IDENTIFIANT
  // STABLE, jamais sa position. C'est ce qui manquait : des champs repérés par
  // leur index se décalaient dès qu'une ligne était ajoutée ou retirée, et la
  // frappe atterrissait sur la ligne voisine en l'écrasant.
  var brouillon = null;
  var compteur = 0;
  function ligne(t){ return { id:'L' + (++compteur), t: t || '' }; }
  function brouillonDepuisServeur(){
    brouillon = (D.questions || []).map(function(q){ return ligne(q.texte); });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function appel(action, corps){
    return fetch(API + action, {
      method: corps ? 'POST' : 'GET',
      headers: { 'Content-Type':'application/json' },
      body: corps ? JSON.stringify(corps) : undefined,
      credentials: 'same-origin'
    }).then(function(r){
      return r.text().then(function(txt){
        var d;
        try { d = JSON.parse(txt); }
        catch(e){
          return { ok:false, d:{ erreur:'Réponse inattendue du serveur (HTTP ' + r.status + ').'
            + (txt ? ' ' + txt.replace(/<[^>]*>/g, ' ').trim().slice(0, 160) : '') } };
        }
        return { ok:r.ok, d:d };
      });
    }, function(){
      return { ok:false, d:{ erreur:'Pas de réseau — vérifie ta connexion.' } };
    });
  }

  // --- La porte -------------------------------------------------------------
  function porte(cfg, msg){
    var neuf = !cfg.initialise;
    racine.innerHTML = '<div class="porte"><div class="carte">'
      + '<h2>Espace animateur</h2>'
      + '<div style="font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px">'
      + (neuf ? 'Choisis ton mot de passe' : 'Mot de passe') + '</div>'
      + '<p class="aide" style="margin:0 0 14px">'
      + (neuf ? 'Première visite : définis le mot de passe qui protègera le pilotage du jeu. '
              + 'Note-le, il n’y a pas de récupération.'
              : 'Celui que tu as défini à la première visite.') + '</p>'
      + '<input id="m" type="password" autocomplete="' + (neuf ? 'new-password' : 'current-password') + '">'
      + '<button id="ok" style="width:100%;margin-top:12px">'
      + (neuf ? 'Définir et entrer' : 'Entrer') + '</button>'
      + '<div class="err" id="e">' + esc(msg || '') + '</div>'
      + '</div></div>';
    var inp = document.getElementById('m');
    inp.focus();
    function go(){
      var v = inp.value;
      if(neuf && v.length < 6){ document.getElementById('e').textContent = '6 caractères minimum.'; return; }
      appel(neuf ? 'admin-creer' : 'admin-entrer', { mdp:v }).then(function(r){
        if(!r.ok){ document.getElementById('e').textContent = r.d.erreur || 'Refusé.'; return; }
        modeEditeur = null;
        demarrer();
      });
    }
    document.getElementById('ok').onclick = go;
    inp.onkeydown = function(e){ if(e.key === 'Enter') go(); };
  }

  // --- La charpente, bâtie une seule fois -----------------------------------
  var LIB = { attente:'En salle d’attente', en_cours:'Jeu en cours', fini:'Terminé' };

  function charpente(){
    var lienEleve = location.href.replace(/admin\.html.*$/, '');
    racine.innerHTML = '<div class="enveloppe">'
      + '<header><h1 id="t-titre"></h1>'
        + '<div class="lien">Lien élèves <code>' + esc(lienEleve) + '</code>'
        + '<button class="fant" id="cop">Copier</button></div></header>'
      + '<div class="grille">'
        + '<div>'
          + '<div class="carte" id="c-questions"></div>'
          + '<div class="carte" id="c-pilotage" style="margin-top:16px"></div>'
          + '<div class="carte" id="c-participants" style="margin-top:16px"></div>'
          + '<div class="carte" id="c-apres" style="margin-top:16px"></div>'
        + '</div>'
        + '<div id="c-reponses"></div>'
      + '</div></div>'
      + '<div id="c-dialogue"></div>';
    document.getElementById('cop').onclick = function(){
      var b = document.getElementById('cop');
      navigator.clipboard.writeText(lienEleve).then(function(){
        b.textContent = '✓ Copié';
        setTimeout(function(){ b.textContent = 'Copier'; }, 1600);
      }, function(){});
    };
  }

  // --- L'éditeur de questions ------------------------------------------------
  // Il n'est JAMAIS redessiné par le rafraîchissement automatique : seules les
  // actions de structure (ajout, retrait, déplacement) le reconstruisent. Le
  // champ dans lequel on écrit ne peut donc plus disparaître sous les doigts.
  function dessinerQuestions(){
    var c = document.getElementById('c-questions');
    if(!c) return;

    if(D.etat !== 'attente'){
      c.innerHTML = '<h2>Questions</h2><div class="vide">'
        + D.questions.length + ' question' + (D.questions.length > 1 ? 's' : '')
        + ' en jeu. Pour les modifier, remets la partie en salle d’attente.</div>';
      return;
    }

    if(brouillon === null) brouillonDepuisServeur();
    var rangs = brouillon.map(function(l, i){
      return '<div class="qr" data-ligne="' + l.id + '">'
        + '<span class="poi" data-poi="' + l.id + '" title="Glisser pour déplacer">'
          + '<span class="n">' + (i + 1) + '</span><span class="grip">⠿</span></span>'
        + '<textarea rows="2" data-ch="' + l.id + '" placeholder="Ta question…">'
          + esc(l.t) + '</textarea>'
        + '<button class="x" data-suppr="' + l.id + '" title="Supprimer cette question">×</button>'
      + '</div>';
    }).join('');

    c.innerHTML = '<h2>Questions</h2>'
      + '<div class="qs" id="qs">' + rangs + '</div>'
      + '<div class="barre"><button class="fant" id="plus">+ Ajouter</button>'
      + '<button id="enr">Enregistrer</button></div>'
      + '<div class="msg" id="msg"></div>'
      + '<div class="aide">Entrée valide et ouvre la suivante. Glisse la poignée ⠿ '
      + 'pour changer l’ordre, × pour supprimer.</div>';

    brancherEditeur();
  }

  function dire(texte, erreur){
    var m = document.getElementById('msg');
    if(!m) return;
    m.textContent = texte || '';
    m.className = 'msg' + (erreur ? ' ko' : (texte ? ' ok' : ''));
  }

  function indexDe(id){
    for(var i = 0; i < brouillon.length; i++) if(brouillon[i].id === id) return i;
    return -1;
  }

  // Enregistre le brouillon. Ne redessine PAS l'éditeur : il est déjà à jour,
  // et le reconstruire ferait perdre le curseur.
  function enregistrer(apres){
    var liste = brouillon.map(function(l){ return (l.t || '').trim(); }).filter(Boolean);
    if(!liste.length){ dire('Écris au moins une question.', true); return; }
    dire('Enregistrement…');
    appel('admin-questions', { questions:liste }).then(function(r){
      if(!r.ok){ dire(r.d.erreur || 'L’enregistrement a échoué.', true); return; }
      dire(liste.length + ' question' + (liste.length > 1 ? 's' : '') + ' enregistrée'
           + (liste.length > 1 ? 's' : ''));
      setTimeout(function(){ dire(''); }, 2400);
      signature = '';          // le panneau de droite doit refléter le nouvel ordre
      battre();
      if(apres) apres();
    });
  }

  function brancherEditeur(){
    [].forEach.call(document.querySelectorAll('[data-ch]'), function(ta){
      var id = ta.getAttribute('data-ch');
      ta.oninput = function(){
        var i = indexDe(id);
        if(i >= 0) brouillon[i].t = ta.value;   // repéré par identité, pas par position
      };
      ta.onblur = function(){
        // Filet : on n'exige pas de cliquer sur « Enregistrer » pour ne pas
        // perdre ce qui vient d'être écrit.
        var i = indexDe(id);
        if(i >= 0 && brouillon[i].t.trim()) enregistrer(null);
      };
      ta.onkeydown = function(e){
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          ajouterLigne();
        }
      };
    });

    [].forEach.call(document.querySelectorAll('[data-suppr]'), function(b){
      b.onclick = function(){
        var i = indexDe(b.getAttribute('data-suppr'));
        if(i < 0) return;
        var avait = brouillon[i].t.trim();
        brouillon.splice(i, 1);
        dessinerQuestions();
        // Une ligne vide retirée n'a rien à enregistrer ; une ligne remplie, si.
        if(avait){
          if(brouillon.some(function(l){ return l.t.trim(); })) enregistrer(null);
          else appel('admin-questions', { questions:[] }).then(function(){
            signature = ''; battre(); dire('Toutes les questions ont été retirées.');
          });
        }
      };
    });

    document.getElementById('plus').onclick = function(){ ajouterLigne(); };
    document.getElementById('enr').onclick = function(){ enregistrer(null); };

    brancherGlisser();
  }

  function ajouterLigne(){
    // On enregistre ce qui est déjà écrit AVANT d'ouvrir une ligne vide, puis
    // on redessine une seule fois : plus aucun champ ne disparaît en cours de
    // frappe, puisque le redessin a lieu maintenant et pas dans deux secondes.
    var aEcrire = brouillon.some(function(l){ return l.t.trim(); });
    var neuve = ligne('');
    brouillon.push(neuve);
    dessinerQuestions();
    var ta = document.querySelector('[data-ch="' + neuve.id + '"]');
    if(ta) ta.focus();
    if(aEcrire) enregistrer(null);
  }

  // --- Déplacer une question par glisser-déposer ----------------------------
  var tire = null;
  function brancherGlisser(){
    [].forEach.call(document.querySelectorAll('[data-poi]'), function(poi){
      var rang = poi.closest('.qr');
      // `draggable` n'est armé que depuis la poignée : sinon on ne pourrait
      // plus sélectionner le texte d'une question à la souris.
      poi.onmousedown = function(){ rang.draggable = true; };
      poi.onmouseup   = function(){ rang.draggable = false; };
    });

    [].forEach.call(document.querySelectorAll('.qr'), function(rang){
      rang.ondragstart = function(e){
        tire = rang.getAttribute('data-ligne');
        rang.classList.add('porte');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', tire); } catch(err){}
      };
      rang.ondragend = function(){
        tire = null;
        rang.draggable = false;
        [].forEach.call(document.querySelectorAll('.qr'), function(r){
          r.classList.remove('porte', 'cible', 'cible-bas');
        });
      };
      rang.ondragover = function(e){
        if(!tire || rang.getAttribute('data-ligne') === tire) return;
        e.preventDefault();
        var r = rang.getBoundingClientRect();
        var bas = (e.clientY - r.top) > r.height / 2;
        rang.classList.toggle('cible', !bas);
        rang.classList.toggle('cible-bas', bas);
      };
      rang.ondragleave = function(){ rang.classList.remove('cible', 'cible-bas'); };
      rang.ondrop = function(e){
        e.preventDefault();
        var cible = rang.getAttribute('data-ligne');
        if(!tire || cible === tire) return;
        var r = rang.getBoundingClientRect();
        var apres = (e.clientY - r.top) > r.height / 2;
        var de = indexDe(tire);
        var el = brouillon.splice(de, 1)[0];
        var vers = indexDe(cible) + (apres ? 1 : 0);
        brouillon.splice(vers, 0, el);
        tire = null;
        dessinerQuestions();
        enregistrer(null);
      };
    });
  }

  // --- Les panneaux nourris par le serveur ----------------------------------
  function dessinerPilotage(){
    var c = document.getElementById('c-pilotage');
    var nbEl = D.eleves.length;
    var qActive = D.etat === 'en_cours' ? D.questions[D.idx] : null;
    c.innerHTML = '<h2>Pilotage</h2>'
      + '<div class="etat"><span class="pt ' + D.etat + '"></span>' + LIB[D.etat]
      + (D.etat === 'en_cours' ? ' · question ' + (D.idx + 1) + '/' + D.questions.length : '')
      + '</div>'
      + '<div class="barre">'
      + (D.etat === 'attente'
          ? '<button id="go"' + (D.questions.length ? '' : ' disabled') + '>Lancer le jeu</button>' : '')
      + (D.etat === 'en_cours'
          ? '<button class="fant" id="prec">← Précédente</button>'
            + '<button id="suiv">' + (D.idx + 1 >= D.questions.length
                ? 'Terminer' : 'Question suivante →') + '</button>' : '')
      + (D.etat === 'fini' ? '<button class="fant" id="rouvrir">Rouvrir la salle</button>' : '')
      + '</div>'
      + (qActive ? '<div class="aide" style="margin-top:12px">'
          + qActive.nb + ' réponse' + (qActive.nb > 1 ? 's' : '') + ' sur ' + nbEl
          + (qActive.nb >= nbEl && nbEl > 0 ? ' — tout le monde a répondu.' : '') + '</div>' : '');

    function pilote(quoi){
      appel('admin-pilote', { quoi:quoi }).then(function(){
        modeEditeur = null;   // l'éditeur doit se verrouiller / se rouvrir
        signature = '';
        battre();
      });
    }
    var b;
    if((b = document.getElementById('go')))      b.onclick = function(){ pilote('demarrer'); };
    if((b = document.getElementById('suiv')))    b.onclick = function(){ pilote('suivant'); };
    if((b = document.getElementById('prec')))    b.onclick = function(){ pilote('precedent'); };
    if((b = document.getElementById('rouvrir'))) b.onclick = function(){ pilote('rouvrir'); };
  }

  function dessinerParticipants(){
    var c = document.getElementById('c-participants');
    var n = D.eleves.length;
    c.innerHTML = '<h2>Participants · ' + n + '</h2>'
      + (n ? '<div class="eleves">' + D.eleves.map(function(e){
              return '<span class="el">' + esc(e.nom)
                + '<button data-el="' + e.id + '" title="Retirer">×</button></span>';
            }).join('') + '</div>'
          : '<div class="vide">Personne pour l’instant. Partage le lien ci-dessus : '
            + 'les prénoms s’afficheront ici au fur et à mesure.</div>');
    [].forEach.call(c.querySelectorAll('[data-el]'), function(b){
      b.onclick = function(){
        if(!confirm('Retirer ce participant et ses réponses ?')) return;
        appel('admin-eleve-suppr', { id:+b.getAttribute('data-el') })
          .then(function(){ signature = ''; battre(); });
      };
    });
  }

  function dessinerApres(){
    var c = document.getElementById('c-apres');
    c.innerHTML = '<h2>Après le cours</h2>'
      + '<div class="barre">'
      + '<button class="fant" id="exp">Exporter (CSV)</button>'
      + '<button class="danger" id="raz">Repartir à zéro</button>'
      + '</div>'
      + '<div class="aide">L’export s’ouvre dans Excel ou Numbers.</div>';
    document.getElementById('exp').onclick = function(){ window.location = API + 'admin-export'; };
    document.getElementById('raz').onclick = dialogueRaz;
  }

  // La remise à zéro demande explicitement s'il faut aussi jeter les questions :
  // les garder permet de rejouer le même jeu avec un autre groupe.
  function dialogueRaz(){
    var effacerQ = false;
    var d = document.getElementById('c-dialogue');
    function peindre(){
      d.innerHTML = '<div class="voile" id="voile"><div class="dlg">'
        + '<h3>Repartir à zéro</h3>'
        + '<p>' + (D.eleves.length
            ? 'Les ' + D.eleves.length + ' participant' + (D.eleves.length > 1 ? 's' : '')
              + ' et toutes leurs réponses seront effacé' + (D.eleves.length > 1 ? 's' : '')
              + '. C’est définitif — pense à exporter avant si tu veux garder une trace.'
            : 'Il n’y a encore aucun participant : il n’y a donc rien à effacer de ce '
              + 'côté-là.') + '</p>'
        + '<div class="choix' + (effacerQ ? ' on' : '') + '" id="ch">'
          + '<span class="case">' + (effacerQ ? '✓' : '') + '</span>'
          + '<span><b>Effacer aussi les ' + D.questions.length + ' question'
          + (D.questions.length > 1 ? 's' : '') + '</b>'
          + '<span>Sans cette case, tes questions sont conservées et tu peux relancer '
          + 'le même jeu avec un autre groupe.</span></span>'
        + '</div>'
        + '<div class="dlg-b">'
          + '<button class="fant" id="annul">Annuler</button>'
          + '<button class="danger" id="conf">Effacer</button>'
        + '</div>'
      + '</div></div>';
      document.getElementById('ch').onclick = function(){ effacerQ = !effacerQ; peindre(); };
      document.getElementById('annul').onclick = function(){ d.innerHTML = ''; };
      document.getElementById('voile').onclick = function(e){
        if(e.target.id === 'voile') d.innerHTML = '';
      };
      document.getElementById('conf').onclick = function(){
        // L'API garde les questions quand `questions` vaut vrai.
        appel('admin-raz', { questions: !effacerQ }).then(function(){
          d.innerHTML = '';
          ouvertes = {};
          brouillon = null;
          modeEditeur = null;
          signature = '';
          battre();
        });
      };
    }
    peindre();
  }

  function dessinerReponses(){
    var c = document.getElementById('c-reponses');
    var nbEl = D.eleves.length;
    c.innerHTML = '<div class="carte"><h2>Réponses en direct</h2>'
      + (D.questions.length ? D.questions.map(function(q, i){
          var active = D.etat === 'en_cours' && i === D.idx;
          var ouv = ouvertes[q.id] !== undefined ? ouvertes[q.id] : active;
          var manquants = D.eleves.filter(function(e){
            return !q.reponses.some(function(r){ return r.nom === e.nom; });
          }).map(function(e){ return e.nom; });
          return '<div class="q' + (active ? ' active' : '') + '">'
            + '<div class="q-h" data-bascule="' + q.id + '">'
              + '<span class="q-n">Q' + (i + 1) + '</span>'
              + '<span class="q-t">' + esc(q.texte) + '</span>'
              + '<span class="q-c' + (nbEl && q.nb >= nbEl ? ' plein' : '') + '">'
                + q.nb + '/' + nbEl + '</span>'
            + '</div>'
            + (ouv ? '<div class="q-b">'
                + (q.reponses.length ? q.reponses.map(function(r){
                    return '<div class="rep"><div class="rep-n">' + esc(r.nom) + '</div>'
                      + '<div class="rep-t">' + esc(r.texte) + '</div></div>';
                  }).join('') : '<div class="manque">Aucune réponse pour l’instant.</div>')
                + (manquants.length && q.reponses.length
                    ? '<div class="manque">En attente : ' + esc(manquants.join(', ')) + '</div>' : '')
              + '</div>' : '')
          + '</div>';
        }).join('')
        : '<div class="vide">Ajoute des questions à gauche, elles apparaîtront ici avec '
          + 'les réponses de chacun.</div>')
      + '</div>';
    [].forEach.call(c.querySelectorAll('[data-bascule]'), function(h){
      h.onclick = function(){
        var id = +h.getAttribute('data-bascule');
        var q = D.questions.filter(function(x){ return x.id === id; })[0];
        var actuel = ouvertes[id] !== undefined ? ouvertes[id]
                   : (D.etat === 'en_cours' && q && q.ordre === D.idx);
        ouvertes[id] = !actuel;
        dessinerReponses();
      };
    });
  }

  // --- Le battement ---------------------------------------------------------
  var signature = '';
  function battre(){
    appel('admin-etat').then(function(r){
      if(!r.ok){ if(r.d && /animateur/.test(r.d.erreur || '')) demarrer(); return; }
      D = r.d;
      if(!document.getElementById('c-questions')) charpente();
      document.getElementById('t-titre').textContent = D.titre;

      // L'éditeur n'est rebâti qu'au changement de mode. Tant qu'on reste en
      // salle d'attente, il appartient à celui qui tape : le rafraîchissement
      // ne le touche plus.
      var mode = D.etat === 'attente' ? 'attente' : 'verrouille';
      if(mode !== modeEditeur){
        modeEditeur = mode;
        if(mode === 'verrouille') brouillon = null;
        dessinerQuestions();
      }

      var sig = JSON.stringify([D.etat, D.idx, D.eleves, D.questions]);
      if(sig === signature) return;
      signature = sig;
      dessinerPilotage();
      dessinerParticipants();
      dessinerApres();
      dessinerReponses();
    });
  }

  function demarrer(){
    appel('admin-config').then(function(r){
      if(r.d && r.d.connecte){ battre(); setInterval(battre, 2000); }
      else porte(r.d || { initialise:false });
    });
  }
  demarrer();
})();
</script>
</body>
</html>
