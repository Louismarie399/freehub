---
# FreeHub — déploiement côté serveur (cPanel Git Version Control).
#
# Exécuté PAR LE SERVEUR O2Switch après chaque « pull » du dépôt : copie le code
# du clone git vers le docroot, avec les mêmes protections que l'ancien rsync
# distant (.deployignore préserve les données, .well-known, etc.).
#
# ⚠️ PERMISSIONS : le clone cPanel est créé en 700, et `rsync -a` recopie les
# permissions du dossier source sur le docroot — qui passait donc en 700 à
# chaque déploiement (LiteSpeed → 403 « unable to read htaccess »).
# `--chmod=D755,F644` force dossiers 755 / fichiers 644 quoi qu'il arrive,
# et le chmod final re-garantit le docroot lui-même.
deployment:
  tasks:
    - /usr/bin/rsync -a --delete --chmod=D755,F644 --exclude-from=/home/rtym5189/repositories/freehub/.deployignore /home/rtym5189/repositories/freehub/ /home/rtym5189/free-hub.fr/
    - /bin/chmod 755 /home/rtym5189/free-hub.fr
    # Empreinte du commit réellement déployé : c'est ce que le contrôle de santé
    # compare, pour qu'un déploiement qui n'a pas eu lieu ne puisse pas passer
    # pour un succès (l'ancien contrôle se contentait de /api/ping, qui répond
    # « ok » même quand le code n'a pas bougé d'un octet).
    - /bin/sh -c 'cd /home/rtym5189/repositories/freehub && /usr/bin/git rev-parse HEAD > /home/rtym5189/free-hub.fr/version.txt && /bin/chmod 644 /home/rtym5189/free-hub.fr/version.txt'
