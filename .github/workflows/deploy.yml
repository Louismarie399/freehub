# Déploiement automatique de FreeHub sur O2Switch — backend PHP.
#
# PHP est exécuté nativement par LiteSpeed : pas de dépendances à installer,
# pas de process à relancer. Le déploiement se résume à un rsync, suivi d'un
# contrôle de santé de l'API.
#
# Runner : self-hosted (sur le Mac de Louis), car O2Switch limite le SSH à des
# IP autorisées manuellement dans cPanel — les runners cloud GitHub n'ont pas
# d'IP fixe. Le runner est installé en service (svc.sh), il survit aux reboots.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   O2S_HOST     cronos.o2switch.net
#   O2S_USER     rtym5189
#   O2S_PATH     /home/rtym5189/free-hub.fr
#   O2S_SSH_KEY  clé privée de déploiement
#   O2S_PORT     (facultatif) 22 par défaut

name: Déploiement O2Switch

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour déployer à la demande

# Un seul déploiement à la fois : évite deux rsync concurrents sur le serveur.
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Si les secrets manquent, on s'arrête proprement au lieu d'échouer en rouge.
      - name: Vérifier la configuration
        id: cfg
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          UTILISATEUR: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          CLE: ${{ secrets.O2S_SSH_KEY }}
        run: |
          if [ -z "$HOTE" ] || [ -z "$UTILISATEUR" ] || [ -z "$CHEMIN" ] || [ -z "$CLE" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets O2Switch absents — déploiement ignoré."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.cfg.outputs.pret == 'oui'
        env:
          CLE: ${{ secrets.O2S_SSH_KEY }}
          HOTE: ${{ secrets.O2S_HOST }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Épingle l'empreinte du serveur : refuse de parler à un hôte inattendu.
          ssh-keyscan -p "$PORT" -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoyer les fichiers
        if: steps.cfg.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          USER: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          # --delete supprime du serveur ce qui a disparu du dépôt, SAUF ce que
          # .deployignore protège (base de données, .well-known, etc.).
          rsync -az --delete --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            ./ "$USER@$HOTE:$CHEMIN/"

      - name: Contrôle de santé
        if: steps.cfg.outputs.pret == 'oui'
        run: |
          # L'API doit répondre en JSON après le déploiement. Sinon, échec visible.
          for i in $(seq 1 10); do
            if curl -s --max-time 15 "https://free-hub.fr/api/ping" | grep -q '"ok":true'; then
              echo "✅ API en ligne — déploiement vérifié."
              exit 0
            fi
            sleep 3
          done
          echo "::error::L'API ne répond pas après le déploiement."
          exit 1
