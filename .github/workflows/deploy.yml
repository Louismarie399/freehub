# Déploiement automatique de FreeHub sur O2Switch.
# Se déclenche à chaque push sur `main`, et manuellement depuis l'onglet Actions.
#
# Secrets à définir dans GitHub (Settings → Secrets and variables → Actions) :
#   O2S_HOST     ex. monsite.o2switch.net  (ou l'IP du serveur)
#   O2S_USER     ton identifiant cPanel
#   O2S_PATH     chemin absolu de l'app, ex. /home/tonuser/freehub
#   O2S_SSH_KEY  la clé PRIVÉE de déploiement (contenu complet du fichier)
#   O2S_PORT     (facultatif) port SSH ; 22 par défaut

name: Déploiement O2Switch

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour déployer à la demande

# Un seul déploiement à la fois : évite deux rsync concurrents sur le serveur.
concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Tant que les secrets O2Switch ne sont pas renseignés (avant la mise en
      # ligne), on s'arrête ici proprement au lieu de faire échouer le workflow.
      - name: Vérifier la configuration
        id: cfg
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          UTILISATEUR: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          CLE: ${{ secrets.O2S_SSH_KEY }}
        run: |
          if [ -z "$HOTE" ] || [ -z "$UTILISATEUR" ] || [ -z "$CHEMIN" ] || [ -z "$CLE" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets O2Switch absents — déploiement ignoré (rien d'anormal avant la mise en ligne)."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.cfg.outputs.pret == 'oui'
        env:
          CLE: ${{ secrets.O2S_SSH_KEY }}
          HOTE: ${{ secrets.O2S_HOST }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Épingle l'empreinte du serveur : refuse de parler à un hôte inattendu.
          ssh-keyscan -p "$PORT" -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoyer les fichiers
        if: steps.cfg.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          USER: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          rsync -az --delete --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            ./ "$USER@$HOTE:$CHEMIN/"

      - name: Installer les dépendances si elles ont changé
        if: steps.cfg.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          USER: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          # Le virtualenv est celui créé par cPanel (« Setup Python App »).
          # Si la commande d'activation diffère chez toi, adapte ACTIVATE ci-dessous.
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOTE" bash -lc "'
            set -e
            cd \"$CHEMIN\"
            ACTIVATE=\$(ls -d \$HOME/virtualenv/*/*/bin/activate 2>/dev/null | head -1)
            if [ -n \"\$ACTIVATE\" ]; then
              source \"\$ACTIVATE\"
              pip install --quiet --upgrade -r requirements.txt || true
            fi
          '" || echo "Étape pip ignorée (virtualenv introuvable) — sans conséquence si rien n'a changé."

      - name: Redémarrer l'application (Passenger)
        if: steps.cfg.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.O2S_HOST }}
          USER: ${{ secrets.O2S_USER }}
          CHEMIN: ${{ secrets.O2S_PATH }}
          PORT: ${{ secrets.O2S_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOTE" \
            "mkdir -p '$CHEMIN/tmp' && touch '$CHEMIN/tmp/restart.txt'"
          echo "✅ Déploiement terminé et application redémarrée."
