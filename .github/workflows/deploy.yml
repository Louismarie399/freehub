# Déploiement automatique de FreeHub sur O2Switch — via l'API cPanel.
#
# ARCHITECTURE (depuis juillet 2026) : le serveur TIRE le code lui-même.
#   push sur main → runner cloud GitHub → API cPanel (HTTPS, port 2083) :
#     1. VersionControl::update            → le serveur fait « git pull »
#     2. VersionControlDeployment::create  → exécute .cpanel.yml (rsync local
#        clone → docroot, protections .deployignore)
#     3. contrôle de santé sur /api/ping
#
# Pourquoi : le port SSH d'O2Switch est limité à une liste blanche d'IP, ce qui
# cassait les déploiements dès que le Mac (ancien runner self-hosted) changeait
# de réseau. L'API cPanel, elle, est accessible en HTTPS de partout — plus de
# dépendance à une IP fixe ni à une machine locale allumée.
#
# Secret requis (Settings → Secrets and variables → Actions) :
#   CPANEL_TOKEN  — jeton créé dans cPanel → Sécurité → Gérer les jetons d'API.
# L'hôte, l'utilisateur et le chemin du clone ne sont pas des secrets : en clair ici.

name: Déploiement O2Switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

env:
  CP_HOTE: cronos.o2switch.net
  CP_USER: rtym5189
  CP_REPO: /home/rtym5189/repositories/freehub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Si le jeton n'est pas encore créé, on s'arrête proprement (pas d'échec rouge).
      - name: Vérifier la configuration
        id: cfg
        env:
          JETON: ${{ secrets.CPANEL_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret CPANEL_TOKEN absent — déploiement ignoré (voir MISE-EN-LIGNE-BRIEF §13)."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Tirer le code sur le serveur (git pull)
        if: steps.cfg.outputs.pret == 'oui'
        env:
          JETON: ${{ secrets.CPANEL_TOKEN }}
        run: |
          REP=$(curl -sS --max-time 90 \
            -H "Authorization: cpanel $CP_USER:$JETON" \
            "https://$CP_HOTE:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=$CP_REPO" \
            --data-urlencode "branch=main")
          echo "$REP" | head -c 600
          echo "$REP" | grep -q '"status":1' || { echo "::error::Échec du pull côté serveur."; exit 1; }

      - name: Déployer (exécuter .cpanel.yml)
        if: steps.cfg.outputs.pret == 'oui'
        env:
          JETON: ${{ secrets.CPANEL_TOKEN }}
        run: |
          REP=$(curl -sS --max-time 90 \
            -H "Authorization: cpanel $CP_USER:$JETON" \
            "https://$CP_HOTE:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=$CP_REPO")
          echo "$REP" | head -c 600
          echo "$REP" | grep -q '"status":1' || { echo "::error::Échec du déploiement côté serveur."; exit 1; }

      - name: Contrôle de santé
        if: steps.cfg.outputs.pret == 'oui'
        run: |
          # Le rsync serveur est quasi instantané, mais on laisse quelques essais.
          for i in $(seq 1 12); do
            if curl -s --max-time 15 "https://free-hub.fr/api/ping" | grep -q '"ok":true'; then
              echo "✅ API en ligne — déploiement vérifié."
              exit 0
            fi
            sleep 5
          done
          echo "::error::L'API ne répond pas après le déploiement."
          exit 1
